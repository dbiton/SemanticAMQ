[package]
name = "capcover_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "capcover_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py310"] }
numpy = "0.30"
rayon = "1.12.0"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
